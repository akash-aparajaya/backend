name: Deploy apinexus Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Sync Files
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'logs' \
            ./ /opt/apps/apinexus/backend/app/

      - name: Deploy apinexus Backend Application
        run: |
          set -e

          cd /opt/apps/apinexus/backend/app
          
          docker rm -f apinexus-backend || true
          
          docker compose up -d --build --force-recreate

          docker image prune -f

          echo "Backend deployment completed successfully."
